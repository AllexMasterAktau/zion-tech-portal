        function loadChapter(num) {
            for (let i = 1; i <= 26; i++) {
                const b = document.getElementById(`btn-ch-${i}`);
                if (b) {
                    b.classList.remove('active');
                    b.classList.add('text-gray-400');
                }
            }
            const activeBtn = document.getElementById(`btn-ch-${num}`);
            if (activeBtn) {
                activeBtn.classList.add('active');
                activeBtn.classList.remove('text-gray-400');
            }

            document.getElementById('chapter-content').innerHTML = chaptersData[num].text;
            document.getElementById('portal-content').scrollTo(0,0);
        }

            document.getElementById('hero-screen').classList.add('hidden');
