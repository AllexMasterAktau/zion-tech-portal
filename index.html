                    <span class="text-[11px] font-mono text-cyan-400 bg-cyan-950/80 px-3 py-1 rounded border border-cyan-800 uppercase">Глава 2</span>

                    <h3 class="text-xl font-orbitron font-bold text-cyan-400 mt-6 mb-3">2.1. Цивилизационный тупик Web 2.0 и распад институтов доверия</h3>
                    <p>Современный цифровой мир, построенный на парадигме Web 2.0, зашел в глубокий цивилизационный тупик. Технологическая инфраструктура, которая изначально создавалась как инструмент человеческого освобождения, свободного обмена знаниями и децентрализации, под давлением корпоративного капитала трансформировалась в глобальную систему цифрового феодализма.</p>
                    <p>В основе этой трансформации лежит капитализм тотального слежения (Surveillance Capitalism). Транснациональные ИТ-монополии (Google, Meta, Amazon и др.) превратили внимание, привычки, эмпатию и личные связи человека в сырье для работы алгоритмов.</p>

                    </ol>
                    <p>В ZION.CITY мы отказались от косметического ремонта этой сломанной системы. Мы создали принципиально новую операционную систему цифрового общества, возвращающую человечеству его утраченный суверенитет.</p>
                    <h3 class="text-xl font-orbitron font-bold text-cyan-400 mt-6 mb-3">2.2. Философский базис: Человек как центр, а не продукт</h3>
                    <p>В основе философии ZION.CITY лежит этический выбор: технология — это не судьба, а осознанное решение. В каждую строчку кода нашей платформы мы заложили фундаментальный гуманистический принцип: «Успех — это быть счастливым, а успех в деле — создавать вещи, которые делают других людей счастливыми».</p>
                    <p>Мы утверждаем, что главной и единственной невосполнимой ценностью во Вселенной является время и душевное спокойствие человека. Человек рожден для творчества, любви, построения сильной семьи и созидательного труда, а не для того, чтобы тратить жизнь на пролистывание спам-рекламы, преодоление бюрократии и кормление банковских посредников.</p>

                        <li><strong>Любовь (Love):</strong> Цифровые инструменты служат укреплению реальных связей в семье, среди друзей и соседей, а не заменяют их виртуальными эрзацами.</li>

                    <h3 class="text-xl font-orbitron font-bold text-cyan-400 mt-6 mb-3">2.3. Принцип Стива Джобса: От пользовательского опыта к технологии</h3>
                    <p>Мы всегда требовали от нашей инженерной команды неукоснительного следования принципу Стива Джобса: «Нужно начинать с пользовательского опыта и идти от него к технологиям, а не наоборот». Сложные распределенные реестры, криптографические алгоритмы Ed25519, ячеистые радиосети LoRa и локальные языковые модели — всё это должно быть абсолютно незаметно для человека.</p>

                    <h3 class="text-xl font-orbitron font-bold text-cyan-400 mt-6 mb-3">2.4. «Оцифрованная порядочность» и «Плановая экономика 2.0 (Just-in-Time)»</h3>
